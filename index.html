<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejemplo Blobs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Ejemplo de uso de Blobs</h2>
    
    <div class="botones">
      <button class="btn-verde" onclick="crearBlob()">Crear Blob de texto</button>
      <button class="btn-verde" onclick="descargarBlob()">Descargar Blob</button>
      <button class="btn-verde" onclick="usarSlice()">Usar Slice</button>
    </div>

    <!-- Contenedor opcional para mostrar los resultados en pantalla -->
    <div id="resultado"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
